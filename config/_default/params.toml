# -- Theme Options --
# https://blowfish.page/docs/configuration/

# Link preview card for LinkedIn, Slack, X, etc. (1200x630, static/img/og-card.jpg).
# Hugo's Open Graph and Twitter templates use this when a page has no image of its own.
images = ["img/og-card.jpg"]

colorScheme = "nebula-stone"
defaultAppearance = "light"
autoSwitchAppearance = false

enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true

mainSections = ["blog", "writeups"]

disableImageOptimization = false
disableTextInHeader = false
navHomeText = "Home"
navHomeIcon = "cc-mark"
navSocial = ["linkedin", "github"]   # author links (languages.en.toml) shown at the top right of every page

defaultFeaturedImage = ""
defaultBackgroundImage = "img/patterns/grain.svg"
backgroundCanvas = true
astral = true
headingFont = "fraunces"
homeSpotlight = true     # the cursor spotlight on Home and Resume too (the lab pages always have it)
labDefaultDark = false   # true opens Writeups, Blog, Homelab and whoami dark until a visitor picks a theme
introSequence = "breach"   # homepage intro (assets/js/intro.js); set to false to turn it off
highlightCurrentMenuArea = true
smartTOC = true
smartTOCHideUnfocusedChildren = false

fingerprintAlgorithm = "sha512"

[header]
  layout = "floating"
  mobileMenuStyle = "dropdown"

[footer]
  showMenu = true
  showCopyright = false
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing"
  layoutSwitcher = false
  showRecent = false   # turn back on once the first post is published
  showRecentItems = 6
  showMoreLink = true
  showMoreLinkDest = "blog"
  cardView = true
  cardViewScreenWidth = false

[article]
  showDate = true
  showViews = false
  showLikes = false
  showDateUpdated = false
  showAuthor = true
  showHero = false
  heroStyle = "basic"
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showReadingProgress = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = true
  showComments = false
  sharingLinks = []
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = true
  groupByYear = true
  cardView = true
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = true
  groupByYear = false
  cardView = false
  cardViewScreenWidth = false

# No analytics on this site, by choice: no tracking scripts, no cookies.

[verification]
