- { key: siem,   name: "SIEM and dashboards",        phase: "Build the lab",        status: planned }
- { key: atomic, name: "Adversary emulation",        phase: "Attack it on purpose", status: planned }
- { key: phish,  name: "Phishing analysis",          phase: "Investigate",          status: planned }
- { key: ir,     name: "Incident response reports",  phase: "Investigate",          status: planned }
- { key: intel,  name: "Threat intel brief",         phase: "Detect and hunt",      status: planned }
- { key: rules,  name: "Detection rules",            phase: "Detect and hunt",      status: planned }
- { key: vuln,   name: "Vulnerability management",   phase: "Beyond the roadmap",   status: planned }
- { key: ctf,    name: "CTF writeups",               phase: "Beyond the roadmap",   status: planned }
