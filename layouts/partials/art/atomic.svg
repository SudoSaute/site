{{- /* Writeup illustration, adversary emulation: a spinning atom and an alert bell that rings. Animated by the art rules in
       assets/css/site/95-spotlight.css; decorative, so hidden from screen readers. */ -}}
<svg class="art art-atomic" viewBox="0 0 360 220" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<g><g class="spin spin-1"><ellipse cx="120" cy="112" rx="68" ry="24"/><circle cx="188" cy="112" r="5" fill="currentColor" stroke="none"/></g></g>
<g transform="rotate(60 120 112)"><g class="spin spin-2"><ellipse cx="120" cy="112" rx="68" ry="24"/><circle cx="52" cy="112" r="5" fill="currentColor" stroke="none"/></g></g>
<g transform="rotate(120 120 112)"><g class="spin spin-3"><ellipse cx="120" cy="112" rx="68" ry="24"/><circle cx="188" cy="112" r="5" fill="currentColor" stroke="none"/></g></g>
<circle cx="120" cy="112" r="16" fill="var(--sec)"/>
<path d="M106 108h28" stroke-width="7" stroke="currentColor"/>
<circle cx="113" cy="108" r="2" fill="var(--art-bg)" stroke="none"/><circle cx="127" cy="108" r="2" fill="var(--art-bg)" stroke="none"/>
<rect x="232" y="138" width="80" height="54" rx="8" fill="var(--art-bg)"/>
<path d="M244 154h40M244 166h28M244 178h34" stroke-width="2.2" opacity=".6"/>
<g class="bell"><path d="M250 132c0-4 4-6 4-16 0-13 7-24 18-24s18 11 18 24c0 10 4 12 4 16z" fill="var(--art-bg)"/><path d="M272 92v-7"/><circle cx="272" cy="138" r="4" fill="currentColor" stroke="none"/></g>
<g class="ring" stroke="var(--sec)" stroke-width="2.6"><path d="M300 92c6 5 9 11 9 19M306 80c9 7 14 16 14 28"/><path d="M244 92c-6 5-9 11-9 19M238 80c-9 7-14 16-14 28"/></g>
</svg>
