# The lab program: the writeups that follow one plan. The /writeups/ page
# draws its program map from this file, in this order, grouped by phase.
#
# status: planned or drafting. A slot shows "Published" on its own once a
# non-draft writeup has `project:` set to its key, so never set that here.
# Drafts are not built on the live site, which is why "drafting" has to be
# set by hand.
- { key: seg,      name: "Network segmentation",                    phase: "Build the lab",  status: planned }
- { key: defend,   name: "Endpoint and email defense",              phase: "Security",       status: planned }
- { key: exposure, name: "Exposure and vulnerability management",   phase: "Security",       status: planned }
- { key: soc,      name: "SOC detections, hunting and response",    phase: "SOC",            status: planned }
- { key: purview,  name: "Purview data protection and compliance",  phase: "Compliance",     status: planned }
- { key: ir,       name: "Incident response reports",               phase: "Practice",       status: planned }
- { key: ctf,      name: "CTF writeups",                            phase: "Practice",       status: planned }
