{{- /* Blog doodle: coins dropping into a RAM stick. Plays on hover in the list, always on the lead post;
       styles in assets/css/lab/blog.css. */ -}}
<svg class="dz dz-ram" viewBox="0 0 120 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<g class="dz-coin dz-c1"><circle cx="34" cy="14" r="7" fill="var(--amber)"/><path d="M34 10v8" stroke-width="2"/></g>
<g class="dz-coin dz-c2"><circle cx="60" cy="14" r="7" fill="var(--amber)"/><path d="M60 10v8" stroke-width="2"/></g>
<g class="dz-coin dz-c3"><circle cx="86" cy="14" r="7" fill="var(--amber)"/><path d="M86 10v8" stroke-width="2"/></g>
<rect x="12" y="38" width="96" height="24" rx="3" fill="var(--art-bg)"/>
<rect x="20" y="44" width="13" height="12" rx="1.5"/><rect x="40" y="44" width="13" height="12" rx="1.5"/><rect x="67" y="44" width="13" height="12" rx="1.5"/><rect x="87" y="44" width="13" height="12" rx="1.5"/>
<path d="M18 62v6M26 62v6M34 62v6M42 62v6M50 62v6M70 62v6M78 62v6M86 62v6M94 62v6M102 62v6" stroke-width="1.8"/><path d="M57 62v-5h6v5" stroke-width="2"/></svg>
