{{- /* Writeup illustration, vulnerability management: a scan beam and a patch. Animated by the art rules in
       assets/css/site/95-spotlight.css; decorative, so hidden from screen readers. */ -}}
<svg class="art art-vuln" viewBox="0 0 360 220" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
<rect x="108" y="24" width="144" height="180" rx="10" fill="var(--art-bg)"/>
<rect x="122" y="40" width="116" height="40" rx="5"/><rect x="122" y="94" width="116" height="40" rx="5"/><rect x="122" y="148" width="116" height="40" rx="5"/>
<path d="M134 54h40M134 64h28M134 162h40M134 172h28" stroke-width="2.2" opacity=".6"/>
<circle class="led led-1" cx="224" cy="60" r="3.2" fill="var(--led)" stroke="none"/>
<circle class="led led-2" cx="224" cy="114" r="3.2" fill="var(--led)" stroke="none"/>
<circle class="led led-3" cx="224" cy="168" r="3.2" fill="var(--led)" stroke="none"/>
<g class="vbug"><ellipse cx="168" cy="118" rx="12" ry="8" fill="var(--sec-soft)"/><circle cx="182" cy="117" r="5" fill="var(--art-bg)"/><path d="M162 125l-4 7M168 126v8M174 125l4 7M185 113l5-6M186 116l7-2" stroke-width="2.4"/></g>
<g class="patch"><g transform="rotate(-18 166 114)"><rect x="144" y="106" width="46" height="16" rx="8" fill="var(--amber)"/><rect x="159" y="106" width="16" height="16" fill="var(--art-bg)" stroke-width="2.2"/><circle cx="164" cy="111" r="1.3" fill="currentColor" stroke="none"/><circle cx="170" cy="117" r="1.3" fill="currentColor" stroke="none"/></g></g>
<rect class="beam" x="100" y="28" width="160" height="8" rx="4" fill="var(--sec)" stroke="none"/>
<g opacity=".55" stroke-width="2.2"><path d="M40 70a40 40 0 0 1 40-40M52 70a28 28 0 0 1 28-28M64 70a16 16 0 0 1 16-16"/><circle cx="80" cy="70" r="3" fill="currentColor" stroke="none"/></g>
<g class="ok" stroke="var(--led)" stroke-width="3"><circle cx="294" cy="60" r="18" fill="var(--art-bg)"/><path d="M285 60l6 6 12-13"/></g>
</svg>
